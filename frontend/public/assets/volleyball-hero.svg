<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#CA8A04" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="netGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#27272A" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#FACC15" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#27272A" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="ballGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="55%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>
  </defs>

  <!-- Fondo Atmosférico Negro/Carbón -->
  <rect width="800" height="450" rx="28" fill="#09090B" />
  <circle cx="460" cy="180" r="260" fill="url(#glow)" />

  <!-- Luces de Estadio -->
  <circle cx="140" cy="60" r="3" fill="#FEF08A" opacity="0.8" />
  <circle cx="680" cy="70" r="4" fill="#FACC15" opacity="0.9" />
  <circle cx="620" cy="45" r="2.5" fill="#FFFFFF" opacity="0.7" />
  <path d="M680 70 L450 260" stroke="#FACC15" stroke-opacity="0.08" stroke-width="45" />
  <path d="M140 60 L380 260" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="35" />

  <!-- Red de Voleibol en Perspectiva -->
  <line x1="60" y1="285" x2="740" y2="235" stroke="url(#netGrad)" stroke-width="5" />
  <line x1="60" y1="365" x2="740" y2="315" stroke="#3F3F46" stroke-width="2" />
  <!-- Malla de la Red -->
  <g stroke="#3F3F46" stroke-width="1" opacity="0.65">
    <line x1="120" y1="281" x2="120" y2="361" />
    <line x1="170" y1="277" x2="170" y2="357" />
    <line x1="220" y1="273" x2="220" y2="353" />
    <line x1="270" y1="270" x2="270" y2="350" />
    <line x1="320" y1="266" x2="320" y2="346" />
    <line x1="370" y1="262" x2="370" y2="342" />
    <line x1="420" y1="259" x2="420" y2="339" />
    <line x1="470" y1="255" x2="470" y2="335" />
    <line x1="520" y1="251" x2="520" y2="331" />
    <line x1="570" y1="247" x2="570" y2="327" />
    <line x1="620" y1="244" x2="620" y2="324" />
    <line x1="670" y1="240" x2="670" y2="320" />
    <line x1="70" y1="310" x2="730" y2="260" />
    <line x1="70" y1="338" x2="730" y2="288" />
  </g>

  <!-- Estela de Velocidad del Remate (Spike Trail) -->
  <path d="M350 110 Q430 95 510 120" stroke="#FACC15" stroke-width="4" stroke-linecap="round" opacity="0.85" />
  <path d="M335 128 Q420 112 500 135" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- Balón de Voleibol en el Punto de Impacto -->
  <g transform="translate(330, 105)">
    <circle cx="0" cy="0" r="32" fill="url(#ballGrad)" stroke="#FFFFFF" stroke-width="2" />
    <path d="M-22 -22 Q0 -8 22 -22" stroke="#09090B" stroke-width="2.5" fill="none" />
    <path d="M-28 5 Q0 18 28 5" stroke="#09090B" stroke-width="2.5" fill="none" />
    <path d="M-10 -30 Q8 0 -10 30" stroke="#09090B" stroke-width="2.5" fill="none" />
    <circle cx="0" cy="0" r="38" stroke="#FACC15" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.7" />
  </g>

  <!-- Silueta Dinámica de Jugador de Voleibol Rematando en el Aire -->
  <g fill="#FFFFFF">
    <!-- Cabeza -->
    <circle cx="458" cy="142" r="18" fill="#FFFFFF" />
    <!-- Brazo de Remate Extendido hacia el Balón -->
    <path d="M442 162 C415 142 385 125 362 112 C356 108 352 116 357 121 C382 138 412 156 436 176 Z" fill="#FACC15" />
    <!-- Torso Atlético Arqueado -->
    <path d="M440 160 L488 172 L472 242 L426 232 Z" rx="10" fill="#FFFFFF" />
    <!-- Dorsal #10 en el Pecho/Espalda -->
    <text x="443" y="212" fill="#09090B" font-family="sans-serif" font-weight="900" font-size="22">10</text>
    <!-- Brazo de Equilibrio Derecho -->
    <path d="M485 172 C515 182 538 198 552 215 C556 220 548 227 542 221 C526 205 505 190 478 184 Z" fill="#D4D4D8" />
    <!-- Pierna Izquierda Flexionada en el Salto -->
    <path d="M432 232 L408 295 L372 325 L382 336 L424 304 L452 238 Z" fill="#FACC15" />
    <!-- Pierna Derecha Extendida en el Salto -->
    <path d="M466 238 L492 308 L528 345 L538 334 L508 298 L482 234 Z" fill="#FFFFFF" />
  </g>
</svg>

